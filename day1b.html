<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription Day1b</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }
    .header {
      text-align: center;
      padding: 20px;
      background-color: #ffffff;
    }
    .logo {
      max-width: 100%;
      height: auto;
    }
    .container {
      max-width: 90%;
      margin: 20px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    input, select {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 10px 0 5px;
      text-align: center;
    }
    button {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 20px auto;
      padding: 10px;
      background-color: #FFD700;
      color: black;
      text-align: center;
      border-radius: 5px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #e6c200;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://image.jimcdn.com/app/cms/image/transf/dimension=570x10000:format=png/path/s02cd059ba246facc/image/ie1bab13e63dfccbe/version/1595508526/image.png" alt="Logo du Club" class="logo">
  </div>
  <div class="container">
    <h2>INSCRIPTION DAY1B DU 13 JUIN 2026 - 10H00</h2>
    <form id="form">
      <input type="text" name="nom" placeholder="Nom" required />
      <input type="text" name="prenom" placeholder="Prénom" required />
      <input type="date" name="date_naissance" id="date_naissance" required />
      <input type="text" name="adresse" placeholder="Adresse" required />
      <input type="text" name="ville" placeholder="Ville" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="tel" name="telephone" placeholder="Numéro de téléphone" required />
        <label for="club">Club :</label>
        <select name="club" id="club" required>
        <option value="">-- Sélectionnez votre club --</option>
        <option value="19PokerClub">19PokerClub</option>
        <option value="Albi Poker 81">Albi Poker 81</option>
        <option value="Association Clermont Poker">Association Clermont Poker</option>
        <option value="Bourges Poker Club">Bourges Poker Club</option>
        <option value="Cantal Poker Club">Cantal Poker Club</option>
        <option value="Cartes sur table">Cartes sur table</option>
        <option value="CPC Chateauroux">CPC Chateauroux</option>
        <option value="Crazy World Poker">Crazy World Poker</option>
        <option value="Hailan Poker Tour">Hailan Poker Tour</option>
        <option value="Hold'em Poker Club Limousin">Hold'em Poker Club Limousin</option>
        <option value="Lacanau de Mios PokerClub">Lacanau de Mios PokerClub</option>
        <option value="La Ciotat">La Ciotat</option>
        <option value="Les Lottois">Les Lottois</option>
        <option value="NoLimit63">NoLimit63</option>
        <option value="OPC Larche">OPC Larche</option>
        <option value="Poker Club Vallée du Lot">Poker Club Vallée du Lot</option>
        <option value="Poker Club Grande Champagne">Poker Club Grande Champagne</option>
        <option value="Poker Team 87">Poker Team 87</option>
        <option value="PokerMix">PokerMix</option>
        <option value="Périgord Poker Club">Périgord Poker Club</option>
        <option value="Redcactus">Redcactus</option>
        <option value="Riviéra Poker Club">Riviéra Poker Club</option>
        <option value="Sons of Poker">Sons of Poker</option>
        <option value="Team BPOKP">Team BPOKP</option>
        <option value="Toulouse Hold'em Poker">Toulouse Hold'em Poker</option>
        <option value="Ussel Poker Club">Ussel Poker Club</option>
        <option value="Sans club">Sans club</option>
        <option value="Autre club">Autre club</option>
      </select>
      <input type="text" name="pseudo" placeholder="Pseudo Live" required />
      <input type="text" name="pseudowinamax" placeholder="Pseudo Winamax" />
      <input type="hidden" name="day1" value="Day1b">
      <label for="repas">
        Repas :<br>
        Formule 25€ entrée / plat / fromage / dessert,<br>
        concocté par nos traiteurs d'exceptions!
      </label>
      <select name="repas" id="repas" required>
        <option value="">-- Choisissez une option --</option>
        <option value="Oui">Oui</option>
        <option value="Non">Non</option>
      </select>
      <button type="submit">S'INSCRIRE</button>
    </form>
  </div>
<script>
  const form = document.getElementById("form");
  const dateNaissanceInput = document.getElementById("date_naissance");
  const clubSelect = document.getElementById("club");

  // Ajout du champ si "Autre club" est sélectionné
  clubSelect.addEventListener("change", () => {
    let autreInput = document.getElementById("autreClub");
    if (clubSelect.value === "Autre club") {
      if (!autreInput) {
        autreInput = document.createElement("input");
        autreInput.type = "text";
        autreInput.name = "club"; // remplace directement le champ club
        autreInput.id = "autreClub";
        autreInput.placeholder = "Entrez le nom de votre club";
        autreInput.required = true;
        clubSelect.insertAdjacentElement("afterend", autreInput);
      }
    } else if (autreInput) {
      autreInput.remove();
    }
  });

  // Vérification de la date de naissance et envoi du formulaire
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const valeurDate = dateNaissanceInput.value;
    if (!valeurDate) {
      alert("Veuillez saisir votre date de naissance.");
      return;
    }

    const dateNaissance = new Date(valeurDate);
    const maintenant = new Date();
    const age = maintenant.getFullYear() - dateNaissance.getFullYear();
    const mois = maintenant.getMonth() - dateNaissance.getMonth();
    const jour = maintenant.getDate() - dateNaissance.getDate();
    const ageExact = (mois < 0 || (mois === 0 && jour < 0)) ? age - 1 : age;

    if (isNaN(dateNaissance.getTime())) {
      alert("Date de naissance invalide. Merci de vérifier le format.");
      return;
    }

    if (ageExact < 18) {
      alert("Vous devez avoir au moins 18 ans pour vous inscrire.");
      return;
    }

    // Gestion de l'envoi du formulaire
    const form = document.getElementById("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {};
      new FormData(form).forEach((value, key) => data[key] = value);
      const url = "https://script.google.com/macros/s/AKfycbwoMr9_NGclJEuM14WkvyA7b1Reok-ba4FT30l_CDR4LuhnHIk2L1do9nD0LRcjeDyJEg/exec";
      try {
        await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(data)
        });
        localStorage.setItem("registered", "true");
        window.location.href = "merci.html";
      } catch (err) {
        alert("Une erreur est survenue. RÃ©essaye plus tard.");
        console.error(err);
      }
    });
</script>

</body>
</html>
